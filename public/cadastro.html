<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro · Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="pagina pagina--centralizada">
    <main class="cartao">
        <header class="cartao__cabecalho">
            <span class="cartao__marca" aria-hidden="true">✔</span>
            <h1 class="cartao__titulo">Criar conta</h1>
            <p class="cartao__subtitulo">Gerenciador de Tarefas</p>
        </header>

        <form id="form-cadastro" class="formulario" novalidate>
            <div class="campo">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                    maxlength="100"
                    autocomplete="name"
                    placeholder="Seu nome"
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    maxlength="100"
                    autocomplete="email"
                    placeholder="voce@exemplo.com"
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    required
                    minlength="6"
                    maxlength="72"
                    autocomplete="new-password"
                    placeholder="Mínimo de 6 caracteres"
                >
            </div>

            <p id="mensagem-erro" class="mensagem mensagem--erro" role="alert" hidden></p>

            <button type="submit" class="botao botao--primario" id="botao-cadastrar">
                Cadastrar
            </button>
        </form>

        <p class="cartao__rodape">
            Já tem conta? <a href="/">Fazer login</a>
        </p>
    </main>

    <script type="module" src="/js/cadastro.js"></script>
</body>
</html>
